[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-sdk"
version = "1.0.0"
description = "On-premise Open Source Face Recognition SDK (detection, landmarks, pose, embedding, matching)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Faceplugin (original models)", email = "info@faceplugin.com" },
]
keywords = [
    "face-recognition",
    "face-detection",
    "computer-vision",
    "deep-learning",
    "biometrics",
    "on-premise",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/Faceplugin-ltd/Open-Source-Face-Recognition-SDK"
Documentation = "https://doc.faceplugin.com/"

[tool.setuptools.packages.find]
where = ["."]
include = ["face_recognition_sdk*"]

[tool.setuptools.package-data]
face_recognition_sdk = [
    "face_detect/models/*.txt",
    "face_detect/models/pretrained/*.pth",
    "face_feature/*.npy",
    "face_landmark/*.pth.tar",
    "face_util/C/*.so",
    "face_util/C/*.dll",
]
